<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Exibe o site corretamente com base no dispositivo do usuário. -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  
  <title>Frontend Mentor | Perfil de links sociais</title>
</head>
<body>

  <main>
    <section class="card">
    <img src="./assets/images/avatar-jessica.jpeg" alt="Foto de Jessica Randall" class="card-image">

    <div class="card-perfil">
      <h1 class="card-title">Jessica Randall</h1>
      <p class="card-location">London, United Kingdom</p>
    </div>
    
    <p class="card-bio">"Front-end developer and avid reader."</p>

    <a class="card-link" href="https://github.com">GitHub</a>
    <a class="card-link" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>
    <a class="card-link" href="https://www.linkedin.com">LinkedIn</a>
    <a class="card-link" href="https://www.twitter.com">Twitter</a>
    <a class="card-link" href="https://www.instagram.com">Instagram</a>

  </section>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/oguilhermekenzo">Guilherme Kenzo</a>.
  </footer>
</body>
</html>
